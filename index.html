<!doctype html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raspored — Raspored App</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1e4a3a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Raspored" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="css/style.css?v=20261007e" />
<style>
  .top-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 16px;
    margin-bottom: 12px;
  }
  @media (max-width: 860px) {
    .top-grid { grid-template-columns: 1fr; }
  }

  .hero-card {
    background: radial-gradient(120% 140% at 100% 0%, #2f7a5d 0%, var(--green-dark) 55%, var(--green-darker) 100%);
    box-shadow: var(--shadow-md);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 14px 24px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hero-card .eyebrow {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.75;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .hero-card h1 { margin: 0 0 2px; font-size: 22px; }
  .hero-card p { margin: 0; opacity: 0.85; font-size: 12px; }
  .hero-ring {
    position: absolute;
    right: -40px;
    top: -40px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 24px solid rgba(255,255,255,0.08);
  }

  .clock-card {
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .clock-time { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .clock-date { color: var(--text-muted); font-size: 13px; }
  .clock-now-pill { display: inline-block; width: fit-content; }

  .filters-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .filters-title { margin-right: 8px; }
  .filters-title h2 { margin: 0; font-size: 16px; }
  .filters-title p { margin: 0; font-size: 11.5px; }
  .raspored-card { padding-top: 16px; }
  .zm-inbox { margin-bottom: 12px; padding: 16px 20px; }
  .zm-inbox[hidden] { display: none; }
  .zm-inbox h2 { margin: 0 0 10px; font-size: 15px; }
  .zm-inbox .zm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .emp-chip.can-swap { cursor: context-menu; }
  #filter-search-info:empty { display: none; }
  .filters-row input, .filters-row select { min-width: 160px; }
  .filters-row .spacer { flex: 1; }
  @media (max-width: 600px) {
    .filters-row { gap: 8px; }
    .filters-title { width: 100%; }
    .filters-row input, .filters-row select { min-width: 0; }
    #filter-search { flex: 1 1 100%; }
    #filter-year, #filter-month { flex: 1 1 0; }
    .filters-row .spacer { display: none; }
    #filter-upcoming { flex: 1 1 100%; }
    #filter-search-info { flex: 1 1 100%; }
  }

  /* Zaglavlje kolona: I / II / III smena — ostaje vidljivo pri skrolovanju */
  .shift-subheader {
    display: grid;
    grid-template-columns: 112px 1fr 118px 1fr 118px 1fr;
    gap: 10px;
    padding: 8px 8px 10px;
    position: sticky;
    top: 67px;
    z-index: 5;
    background: linear-gradient(#fff 85%, rgba(255,255,255,0));
  }
  .shift-col {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 12px;
    background: var(--sc-bg);
    border: 1px solid var(--sc-line);
    border-top: 3px solid var(--sc);
  }
  .shift-col .shift-name { font-weight: 800; font-size: 13px; color: var(--sc); letter-spacing: -0.01em; }
  .shift-col .shift-part { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .shift-col .shift-time { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

  .prev-days-toggle {
    text-align: center;
    padding: 9px;
    background: var(--bg-soft);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    margin: 4px 8px 8px;
    transition: background 0.15s;
  }
  .prev-days-toggle:hover { background: var(--green-light); color: var(--text); }

  .day-row {
    display: grid;
    grid-template-columns: 112px 1fr 118px 1fr 118px 1fr;
    gap: 10px;
    padding: 6px 8px;
    margin: 0 0 4px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    align-items: stretch;
  }
  .day-row.weekend { background: #f7f3e8; }

  /* Datum kao kalendarski list */
  .date-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px;
  }
  .date-label .dnum {
    font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
    min-width: 30px; font-variant-numeric: tabular-nums;
  }
  .date-label .dmeta { display: flex; flex-direction: column; line-height: 1.15; }
  .date-label .dow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .date-label .dmon { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .day-row.weekend .date-label .dow { color: #b4532a; }
  .today-badge {
    display: inline-block; margin-top: 3px; width: fit-content;
    background: var(--green-dark); color: #fff; font-size: 9.5px; font-weight: 800;
    letter-spacing: 0.06em; padding: 2px 6px; border-radius: 5px; text-transform: uppercase;
  }

  .day-row .shift-cell {
    display: flex; flex-wrap: wrap; gap: 6px; align-content: center;
    background: var(--sc-bg);
    border-left: 3px solid var(--sc);
    border-radius: 10px;
    padding: 8px 10px;
    min-height: 44px;
  }
  .day-row .shift-cell .empty { color: var(--text-muted); font-size: 11px; }
  /* Zaposleni u rasporedu — zbijeniji prikaz */
  .day-row .shift-cell { gap: 4px; }
  .day-row .chip { font-size: 10.5px; padding: 3px 8px; gap: 4px; }
  .day-row .chip .dot { width: 6px; height: 6px; }
  /* Međusmena — uža kolona između smena */
  .shift-col.ms-col { padding: 9px 8px; gap: 6px; border-top-width: 3px; }
  .shift-col.ms-col .shift-icon { width: 13px; height: 13px; }
  .day-row .shift-cell.ms-cell { padding: 8px 6px; }
  .shift-col.ms-col .shift-name { font-size: 11.5px; }
  .shift-col.ms-col .shift-time { margin-left: 0; font-size: 11px; color: var(--text-muted); }
  .day-row .shift-cell.ms-cell { border-left-style: dashed; justify-content: center; }
  .day-row .shift-cell.ms-cell .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  .day-row.today {
    border-color: var(--green-dark);
    background: #fff;
    box-shadow: var(--shadow-md);
  }
  .day-row.today .shift-cell.active-shift {
    box-shadow: inset 0 0 0 2px var(--sc);
    position: relative;
  }
  .day-row.today .shift-cell.active-shift::after {
    content: "SADA";
    position: absolute; top: -8px; right: 10px;
    background: var(--sc); color: #fff; font-size: 9px; font-weight: 800;
    letter-spacing: 0.06em; padding: 2px 6px; border-radius: 5px;
  }

  .day-row.day-off-for-search { border: 2.5px solid var(--green-dark); background: #fdf0ef; }
  .emp-chip.is-me { background: var(--green-darker); border-color: var(--green-darker); color: #fff; }
  .emp-chip.search-hit { background: #2459c9; border-color: #2459c9; color: #fff; }

  /* Telefon: dan ide jedan ispod drugog, svaka smena sa svojom oznakom */
  @media (max-width: 820px) {
    .shift-subheader { display: none; }
    .day-row { grid-template-columns: 1fr; gap: 6px; padding: 10px; background: #fff; border: 1px solid var(--line); margin-bottom: 8px; }
    .day-row.weekend { background: #fbf8f0; }
    .day-row .shift-cell.ms-cell.is-empty { display: none; }
    .day-row .shift-cell.ms-cell { justify-content: flex-start; }
    .day-row .shift-cell::before {
      content: attr(data-label);
      font-size: 11px; font-weight: 800; color: var(--sc); width: 100%;
    }
  }

  .month-wrap { margin-bottom: 18px; }

  /* ---------- Mobilni prikaz (telefon) ---------- */
  #mobile-home { display: none; }
  @media (max-width: 700px) {
    #mobile-home { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    body:not(.show-full) .top-grid,
    body:not(.show-full) .raspored-card { display: none; }
  }
  .mob-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 14px; }
  .mob-title { font-size: 13px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .mob-title .mob-clock { font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--text); font-variant-numeric: tabular-nums; }

  .mob-next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mob-next-item { border-radius: 12px; padding: 10px 8px; background: var(--sc-bg); border: 1px solid var(--sc-line); border-top: 3px solid var(--sc); text-align: center; cursor: pointer; }
  .mob-next-item .d { font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .mob-next-item .s { font-size: 22px; font-weight: 800; color: var(--sc); line-height: 1.2; margin: 2px 0; }
  .mob-next-item .t { font-size: 13px; font-weight: 600; }
  .mob-next-item.is-off { --sc: var(--text-muted); --sc-bg: #fff; --sc-line: var(--line); }
  .mob-next-item .now { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: var(--sc); color: #fff; border-radius: 5px; padding: 1px 6px; }

  .mob-now-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sc-bg); border-left: 3px solid var(--sc); margin-bottom: 8px; }
  .mob-now-head .n { font-weight: 800; color: var(--sc); font-size: 17px; }
  .mob-now-head .t { margin-left: auto; font-weight: 700; font-size: 14px; }
  .mob-people { display: flex; flex-direction: column; }
  .mob-person { display: flex; align-items: center; gap: 9px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; }
  .mob-person:last-child { border-bottom: none; }
  .mob-person .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .mob-person .role { margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
  .mob-person.is-me { background: var(--green-darker); color: #fff; border-radius: 10px; padding-left: 10px; padding-right: 10px; border-bottom-color: transparent; }
  .mob-person.is-me .role { color: rgba(255,255,255,0.75); }
  .mob-sub { font-size: 13px; font-weight: 800; color: var(--sc); margin: 10px 0 2px; }
  .mob-empty { font-size: 15px; color: var(--text-muted); padding: 6px 2px; }

  .mob-days { display: flex; flex-direction: column; gap: 6px; }
  .mob-day { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .mob-day.weekend { background: #fbf8f0; }
  .mob-day.today { box-shadow: inset 0 0 0 2px var(--green-dark); }
  .mob-day .dn { font-size: 20px; font-weight: 800; width: 26px; font-variant-numeric: tabular-nums; }
  .mob-day .dm { font-size: 13px; font-weight: 700; color: var(--text-muted); line-height: 1.2; width: 34px; }
  .mob-day .sh { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .mob-day .sh .lbl { font-size: 14px; font-weight: 700; color: var(--sc); }
  .mob-day .sh .tm { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .mob-day .off { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--text-muted); font-style: italic; }
  .mob-day .mob-day-badge { background: var(--sc); color: #fff; border-radius: 8px; padding: 4px 11px; font-weight: 800; font-size: 16px; min-width: 38px; }
  .mob-day .chev { color: var(--text-muted); font-size: 18px; }
  .mob-full-btn { width: 100%; font-size: 15px; padding: 12px; }
  @media (max-width: 700px) {
    .zm-inbox h2 { font-size: 17px; }
    .zm-item .zm-date, .zm-item .zm-swap { font-size: 15px; }
    .zm-item .zm-reason { font-size: 14.5px; }
    .zm-item .zm-meta { font-size: 13px; }
    .zm-item .zm-staff { font-size: 14px; }
    .zm-item .btn { font-size: 15px; padding: 11px 14px; }
  }

  /* ---------- Računar: mojih narednih 7 dana ---------- */
  .my-week { margin-bottom: 12px; padding: 16px 20px; }
  .my-week[hidden] { display: none; }
  .my-week h2 { margin: 0 0 12px; font-size: 15px; }
  .my-week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .wk-day { border-radius: 12px; padding: 10px 8px; text-align: center; cursor: pointer; background: var(--sc-bg); border: 1px solid var(--sc-line); border-top: 3px solid var(--sc); transition: transform 0.12s; }
  .wk-day:hover { transform: translateY(-2px); }
  .wk-day.is-off { --sc: var(--text-muted); --sc-bg: #fff; --sc-line: var(--line); }
  .wk-day.today { box-shadow: 0 0 0 2px var(--green-dark); }
  .wk-day .d { font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .wk-day .s { font-size: 24px; font-weight: 800; color: var(--sc); line-height: 1.2; margin: 3px 0; }
  .wk-day .t { font-size: 12px; font-weight: 600; }
  .day-row.flash { animation: dayflash 1.6s ease; }
  @keyframes dayflash { 0%, 40% { box-shadow: 0 0 0 3px var(--green-dark); } 100% { box-shadow: none; } }
  @media (max-width: 700px) { .my-week { display: none; } }

  /* Ceo raspored za jedan dan — prozor odozdo */
  .day-sheet-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(20, 30, 25, 0.35); display: flex; align-items: flex-end; justify-content: center; }
  .day-sheet { background: var(--bg, #f4f2ec); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 14px 24px; }
  .day-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day-sheet-head h3 { margin: 0; font-size: 18px; }
  .day-sheet-close { border: none; background: #fff; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; }
  .day-sheet .mob-card { margin-bottom: 10px; }
  .day-sheet .mob-hint { font-size: 13.5px; color: var(--text-muted); margin: 0 2px 10px; }
  .empty-note { padding: 24px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
  <header class="app-header" id="app-header-mount"></header>

  <main class="page">
    <section class="top-grid">
      <div class="hero-card">
        <div class="hero-ring"></div>
        <div class="eyebrow">Mesečni plan rada</div>
        <h1>Ko radi danas?</h1>
        <p>Javni pregled je dostupan bez prijave. Prijavite se da odmah vidite svoje smene.</p>
      </div>
      <div class="card clock-card">
        <div class="clock-time" id="clock-time">--:--</div>
        <div>
          <div class="clock-date" id="clock-date">—</div>
          <span class="pill pill-green clock-now-pill" id="clock-shift">Sada: —</span>
        </div>
      </div>
    </section>

    <div id="zm-banner"></div>
    <section class="card zm-inbox" id="zm-inbox" hidden>
      <h2>Zahtevi za zamenu</h2>
      <div class="zm-list" id="zm-inbox-list"></div>
    </section>

    <section class="card my-week" id="my-week" hidden>
      <h2>Tvojih narednih 7 dana</h2>
      <div class="my-week-grid" id="my-week-grid"></div>
    </section>

    <div id="mobile-home"></div>

    <section class="card raspored-card">
      <div class="filters-row">
        <div class="filters-title">
          <h2>Raspored po danima</h2>
          <p class="muted">Svaki red je jedan dan, podeljen na tri smene.</p>
        </div>
        <input id="filter-search" type="text" placeholder="Pronađi zaposlenog..." />
        <span id="filter-search-info" class="muted" style="font-size:12px;"></span>
        <select id="filter-year"></select>
        <select id="filter-month"></select>
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="filter-upcoming">Tekući i naredni meseci</button>
      </div>

      <div id="months-container"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=20261007e"></script>
  <script src="js/auth.js?v=20261007e"></script>
  <script src="js/push.js?v=20261007e"></script>
  <script src="js/constants.js?v=20261007e"></script>
  <script src="js/swap-common.js?v=20261007e"></script>
  <script src="js/raspored.js?v=20261007e"></script>
</body>
</html>
