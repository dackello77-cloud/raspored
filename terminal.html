<!doctype html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal — Raspored App</title>
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #1f2a24; font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; user-select: none; overflow: hidden; }
  .t-head { display: flex; align-items: center; gap: 14px; }
  .t-head img { width: 44px; height: 44px; }
  .t-title { font-size: clamp(20px, 3.4vh, 34px); font-weight: 800; }
  .t-clock { font-size: clamp(16px, 2.6vh, 26px); color: #6b7570; font-weight: 600; font-variant-numeric: tabular-nums; }
  #qr { width: min(62vh, 86vw); height: min(62vh, 86vw); display: flex; align-items: center; justify-content: center; }
  #qr svg { width: 100%; height: 100%; display: block; }
  .t-bar { width: min(62vh, 86vw); height: 8px; border-radius: 99px; background: #eef2ea; overflow: hidden; }
  .t-bar i { display: block; height: 100%; width: 100%; background: #1e4a3a; transform-origin: left; }
  .t-hint { font-size: clamp(15px, 2.4vh, 24px); color: #6b7570; text-align: center; }
  .t-msg { font-size: clamp(16px, 2.6vh, 26px); font-weight: 700; color: #c0392b; text-align: center; padding: 0 20px; }
  .t-recent { min-height: 6vh; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 16px; }
  .t-recent span { background: #dff0d8; color: #163a2d; border-radius: 99px; padding: 8px 16px; font-size: clamp(14px, 2.2vh, 20px); font-weight: 700; animation: pop 0.3s ease-out; }
  .t-recent span.late { background: #fff1dc; color: #a35a00; }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } }
  .t-fs { position: fixed; top: 10px; right: 10px; border: 1px solid #e4ded0; background: #fff; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; color: #6b7570; }
  :fullscreen .t-fs { display: none; }
</style>
</head>
<body>
  <button class="t-fs" id="t-fs" type="button">Ceo ekran</button>
  <div class="t-head">
    <img src="icons/logo.png" alt="" />
    <div class="t-title">Prijava dolaska</div>
  </div>
  <div class="t-clock" id="t-clock">--:--</div>
  <div id="qr"></div>
  <div class="t-bar"><i id="t-bar"></i></div>
  <div class="t-hint" id="t-hint">Otvori aplikaciju → dugme <b>Dolazak</b> → skeniraj kod</div>
  <div class="t-recent" id="t-recent"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="js/supabase.js?v=20261007g"></script>
  <script src="js/auth.js?v=20261007g"></script>
  <script src="js/constants.js?v=20261007g"></script>
  <script src="js/terminal.js?v=20261007g"></script>
</body>
</html>
